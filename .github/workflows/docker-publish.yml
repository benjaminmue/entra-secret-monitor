name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gate:
    permissions:
      contents: read
    # Ohne diese Abhaengigkeit liefe der Veroeffentlichungslauf am Gate vorbei,
    # auch bei einem Tag und bei manueller Ausloesung. Das Gate waere dann eine
    # Beschreibung und keine Bedingung.
    uses: ./.github/workflows/security.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without cache: a cached apt-get upgrade layer would ship the
          # Debian packages of its first build, while the gate, which builds
          # fresh, reports the current ones as clean.
          no-cache: true
          pull: true

      - name: Smoke test the amd64 image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker run -d --name smoke -p 8099:8099 \
            -e TENANTS=demo \
            -e DEMO_TENANT_ID=demo.invalid \
            -e DEMO_CLIENT_ID=x \
            -e DEMO_CLIENT_SECRET=y \
            "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null 2>&1; then
              echo "healthz OK"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/healthz
          echo
          # The dummy tenant cannot reach Graph, so the sensor must report an
          # error instead of failing silently. That is the contract we verify.
          curl -fsS "http://127.0.0.1:8099/prtg?tenant=demo" | tee /tmp/prtg.xml
          grep -q "<error>1</error>" /tmp/prtg.xml
          curl -fsS http://127.0.0.1:8099/ | grep -q "Entra ID Secret Monitor"
          docker logs smoke
          docker rm -f smoke
