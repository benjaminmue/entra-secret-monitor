name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gate:
    permissions:
      contents: read
    # Ohne diese Abhaengigkeit liefe der Veroeffentlichungslauf am Gate vorbei,
    # auch bei einem Tag und bei manueller Ausloesung. Das Gate waere dann eine
    # Beschreibung und keine Bedingung.
    uses: ./.github/workflows/security.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build the amd64 image first and load it into the local daemon, so the
      # smoke test runs against exactly this build before anything is pushed.
      # Testing ":latest" from GHCR checked the previous image on tag builds,
      # because "latest" is only set on the default branch, and it ran after the
      # push.
      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: smoke-candidate:${{ github.sha }}
          # Without cache: a cached apt-get upgrade layer would ship the
          # Debian packages of its first build, while the gate, which builds
          # fresh, reports the current ones as clean.
          no-cache: true
          pull: true

      - name: Smoke test the amd64 image
        env:
          IMAGE: smoke-candidate:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8099:8099 \
            -e TENANTS=demo \
            -e DEMO_TENANT_ID=demo.invalid \
            -e DEMO_CLIENT_ID=x \
            -e DEMO_CLIENT_SECRET=y \
            "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null 2>&1; then
              echo "healthz OK"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/healthz
          echo
          # The dummy tenant cannot reach Graph, so the sensor must report an
          # error instead of failing silently. That is the contract we verify.
          curl -fsS "http://127.0.0.1:8099/prtg?tenant=demo" | tee /tmp/prtg.xml
          grep -q "<error>1</error>" /tmp/prtg.xml
          curl -fsS http://127.0.0.1:8099/ | grep -q "Entra ID Secret Monitor"
          docker logs smoke
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No no-cache here on purpose: the builder of this job holds only the
          # layers of the fresh amd64 build above (no GHA cache is configured),
          # so the pushed amd64 image reuses exactly the layers that passed the
          # smoke test. arm64 is built fresh. pull keeps the base current.
          pull: true
