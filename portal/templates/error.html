{% extends "base.html" %}
{% block title %}Fehler {{ code }}{% endblock %}
{% block content %}
<div class="error-wrap">
  <div class="card">
    <h2>Fehler</h2>
    <div class="code">{{ code }}</div>
    <p class="lead">{{ message }}</p>
    <a class="btn" href="{{ url_for('dashboard.index') }}">Zur Übersicht</a>
  </div>
</div>
{% endblock %}
